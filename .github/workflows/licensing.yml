name: Theme verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: holonight-icons
      - working-directory: holonight-icons
        run: python3 scripts/ci/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: themes-and-previews
          path: holonight-icons/build/ci/*/artifacts/verification/
