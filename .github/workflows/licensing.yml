name: Theme verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: holonight-icons
      - working-directory: holonight-icons
        run: python3 scripts/ci/run.py --prepare
      - working-directory: holonight-icons
        run: python3 scripts/ci/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: themes-and-previews
          path: holonight-icons/build/ci/*/artifacts/verification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            holonight-icons/build/ci/*/*.log
            holonight-icons/build/ci/*/results.json
            holonight-icons/build/ci-prepared/manifest.json
            holonight-icons/build/ci-prepared/deps/renderer-state.json
            holonight-icons/build/ci-prepared/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-payload
          path: holonight-icons/build/ci/*/artifacts/release/package/
